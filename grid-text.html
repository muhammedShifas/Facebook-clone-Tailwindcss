<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
    .box{
        background-color: rgb(66, 190, 172);
        display: grid;
        justify-items: center;
        place-items: center;
        font-size: 24px;
        color: bisque;
        border-radius: 20px;
    }
    .grid_items{
        display: grid;
        grid-template-columns: repeat(3, 200px);
        grid-template-rows: repeat(3, 200px);
        gap: 16px;
        grid-template-areas: "box-1 box-2 box-2"
                             "box-1 box-3 box-4"
                             "box-5 box-5 box-6";
    }
</style>

    <div class="grid_items">
        <div class="box" style="grid-area: box-1;">1</div>
        <div class="box" style="grid-area: box-2;">2</div>
        <div class="box" style="grid-area: box-3;">3</div>
        <div class="box" style="grid-area: box-4;">4</div>
        <div class="box" style="grid-area: box-5;">5</div>
        <div class="box" style="grid-area: box-6;">6</div>
    </div>
</body>
</html>

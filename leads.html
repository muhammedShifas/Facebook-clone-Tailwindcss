<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
         .sidebar::-webkit-scrollbar {
            display: none;
        }
    </style>
    <title>Facebook</title>
    <link rel="icon" href="facebook-og.svg">
</head>
<body>
    <!-- container -->
    <div class=" w-screen h-[100vh] bg-gradient-to-br from-[#F5EEF1] via-[#DDE8F5] to-[#E9F7F1]">

        <!-- side-bar -->
        <div class=" side-bar fixed h-[100vh] w-[60px] bg-white flex flex-col items-center overflow-y-auto scroll-hide">
            <div class="w-[60px] h-[60px] flex justify-center items-center mt-[10px]">
                <img class="w-[50px] h-[50px] mt-[10px]" src="meta.png" alt="">
            </div>
           <div class="flex justify-center items-center mt-[30px] w-[60px] h-fit pr-[5px] relative">
             <div class="w-[60px] h-fit flex justify-center items-center z-50  cursor-pointer  ">
                <img class="w-[30px] h-[30px] rounded-[45px]" src="profile.jpg" alt="">
                <div class="ml-[-15px] mb-[-15px] w-[15px] h-[15px] rounded-[25px] bg-white flex justify-center items-center"><img class="w-[15px] h-[15px] rounded-[20px]" src="facebook-og.svg" alt=""></div>
            </div>
            <div class="w-[60px] h-fit flex justify-center items-center absolute top-[-10px] left-[7px]  cursor-pointer ">
                <img class="w-[30px] h-[30px] rounded-[45px]" src="profile.jpg" alt="">
                <div class="ml-[-15px] mb-[-15px] w-[15px] h-[15px] rounded-[7px] bg-white flex justify-center items-center"><img class="w-[13px] h-[13px] " src="instagram.png" alt=""></div>
            </div>
           </div>

           <div class="w-[60px] h-fit flex flex-col justify-start items-center gap-[5px] mt-[15px]">
                <div class="home w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA]  flex justify-center items-center">
                <img src="home-solid.png" alt="">
            </div>
            <div class="w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA] flex justify-center items-center relative">
                <img class="w-[35px] h-[35px]" src="bell-solid.png" alt="">
                <div class="w-[8px] h-[8px] rounded-full absolute top-[6px] right-[6px] bg-red-700"></div>
            </div>
            <div class="w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA] flex justify-center items-center">
                <img class="w-[27px] h-[27px]" src="logo2.png" alt="">
            </div>
            <div class="w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA] flex justify-center items-center relative">
                <img class="w-[30px] h-[30px]" src="chat.png" alt="">
                <!-- absolute-postion for red dot -->
                <div class="w-[8px] h-[8px] rounded-full absolute top-[6px] right-[6px] bg-red-700"></div>
            </div>
            <div class="w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA] flex justify-center items-center">
                <img class="w-[33px] h-[33px]" src="logo-3.png" alt="">
            </div>
            <div class="w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA] flex justify-center items-center">
                <img class="w-[22px] h-[22px]" src="calendar.svg" alt="">
                </div>
                <div class="w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA] flex justify-center items-center">
                <img class="w-[22px] h-[22px]" src="horn.svg" alt="">
                </div>
                <div class="w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA] flex justify-center items-center">
                <img class="w-[22px] h-[22px]" src="signal.svg" alt="">
                </div>
                <div class="w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA] flex justify-center items-center">
                <img class="w-[33px] h-[33px]" src="live.png" alt="">
                </div>
                <div class="w-[42px] h-[42px] rounded-[8px] bg-[#283943] flex justify-center items-center relative">
                <div class="flex justify-center items-center w-[27px] h-[21px] rounded-[6px] border-[#20262D] bg-white border-[2px]"><img class="w-[26px] h-[26px] object-cover" src="group-1.png" alt=""></div>
                <div class="w-[8px] h-[8px] rounded-full absolute top-[7px] right-[6px] bg-red-700"></div>
                </div>
                <div class="w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA] flex justify-center items-center mt-[2px]">
                <img class="w-[27px] h-[27px] ml-[2px]" src="whatsapp.svg" alt="">
                </div>
           </div>
           <hr class="w-[25px] h-[2px] bg-[#283943] mt-[20px]">
           <div class="w-[60px] h-fit flex flex-col justify-center items-center mt-[10px]">
                <div class="w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA] flex justify-center items-center mt-[2px]">
                <img class="w-[27px] h-[27px]" src="search.svg" alt="">
                </div>
                <div class="w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA] flex justify-center items-center mt-[4px]">
                <img class="w-[35px] h-[35px]" src="settings-1.png" alt="">
                </div>
                <div class="w-[35px] h-[35px] rounded-full bg-[#F1F4F7] flex justify-center items-center mt-[5px]">
                <img class="w-[22px] h-[22px]" src="question-mark.svg" alt="">
                </div>
            </div>
        </div>
        <!-- main section -->
            <div class="w-[1380px] h-screen ml-[60px]">
     <!-- navbar -->
         <!-- leads centre -->
                <!-- header -->
                <div class="w-[1380px] h-[60px] flex justify-between items-center">
                    <p class="ml-[20px] text-[20px] font-semibold text-[#1C1E21]">Leads Centre</p>

                <!-- right buttons -->
                     <div class="flex items-center gap-[8px] mr-[15px]">

                    <button class="w-[155px] h-[38px] bg-white border-[1px] border-[#CED0D4] rounded-[6px] flex justify-around items-center gap-[8px] hover:bg-[#F2F2F2] cursor-pointer">
                        <img src="contacts.png" alt="" class="w-[30px]">
                        <p class="text-[15px] -ml-[20px]">Audiences</p>
                        <i class="fa-solid fa-caret-down text-[12px] -ml-[10px]"></i>
                    </button>

            <div class="w-[38px] h-[38px] bg-white border-[1px] border-[#CED0D4] rounded-[6px] flex justify-center items-center hover:bg-[#F2F2F2] cursor-pointer">
                <i class="fa-solid fa-download"></i>
            </div>

            <div class="w-[38px] h-[38px] bg-white border-[1px] border-[#CED0D4] rounded-[6px] flex justify-center items-center hover:bg-[#F2F2F2] cursor-pointer">
                <i class="fa-regular fa-bell"></i>
            </div>

            <div class="w-[38px] h-[38px] bg-white border-[1px] border-[#CED0D4] rounded-[6px] flex justify-center items-center hover:bg-[#F2F2F2] cursor-pointer">
                <i class="fa-solid fa-gear"></i>
            </div>

            <button class="w-[150px] h-[38px] bg-[#006EBC] rounded-[6px] flex justify-center items-center gap-[8px] hover:bg-[#0861F2] cursor-pointer">
                <i class="fa-solid fa-plus text-white"></i>
                <p class="text-white text-[15px]">Add leads</p>
                <i class="fa-solid fa-caret-down text-[12px] text-white"></i>
            </button>

          <div class="w-[60px] h-fit flex justify-center items-center cursor-pointer  ">
                <img class="w-[35px] h-[35px] rounded-[45px]" src="profile.jpg" alt="">
                <div class="ml-[-15px] mb-[-15px] w-[15px] h-[15px] rounded-[25px] bg-white flex justify-center items-center"><img class="w-[15px] h-[15px] rounded-[20px]" src="facebook-og.svg" alt=""></div>
            </div>
            
            
          

        </div>
    </div>
   <!-- white section -->
    <div class="w-[1350px] h-[130px] bg-white rounded-[8px] border-[1px] border-[#E4E6EB] ml-[15px]">

        <!-- top navigation -->
        <div class="w-[1350px] h-[55px] flex justify-between items-center">

            <!-- left tabs -->
            <div class="flex items-center ml-[15px] mt-[10px]">
                <div class="w-[145px] h-[36px] bg-[#E7F3FF] rounded-[6px] flex justify-center items-center gap-[8px] cursor-pointer">
                    <img src="pipeline.png" alt="" class="w-[40px] h-[40px] -ml-[10px] ">
                     <p class="text-[#006EBC] text-[15px] font-semibold -ml-[10px]">Pipeline view</p>
                    
                </div>

                <div class="w-[120px] h-[36px] rounded-[6px] flex justify-center items-center gap-[8px] ml-[8px] hover:bg-[#F2F2F2] cursor-pointer">
                    <i class="fa-solid fa-table-list"></i>
                    <p class="text-[15px]">Table view</p>                    
                </div>

            </div>

            <!-- hide filters -->
            <button class="w-[135px] h-[38px] bg-white border-[1px] border-[#CED0D4] rounded-[6px] flex justify-center items-center gap-[8px] mr-[18px] hover:bg-[#F2F2F2] cursor-pointer">
                <i class="fa-solid fa-sliders"></i>
                <p class="text-[15px]">Hide filters</p>
            </button>

        </div>
            <!-- filter section -->
        <div class="w-[1330px] h-[60px] flex items-center">

            <!-- add custom stage -->
            <button class="w-[165px] h-[38px] ml-[18px] bg-white border-[1px] border-[#CED0D4] rounded-[6px] hover:bg-[#F2F2F2] flex justify-center items-center cursor-pointer">
                <p class="text-[15px] text-[#1C1E21]">Add custom stage</p>
            </button>

            <!-- divider -->
            <div class="w-[2px] h-[33px] bg-gray-500 ml-[12px]"></div>

            <!-- bulk edit -->
            <button class="w-[95px] h-[38px] ml-[12px] bg-white border-[1px] border-[#CED0D4] rounded-[6px] hover:bg-[#F2F2F2] flex justify-center items-center cursor-pointer">
                <p class="text-[15px] text-[#1C1E21]">Bulk edit</p>
            </button>

            <!-- add filters -->
            <button class="w-[220px] h-[38px] ml-[12px] bg-white border-[1px] border-[#CED0D4] rounded-[6px] hover:bg-[#F2F2F2] flex items-center cursor-pointer">

                <div class="w-[30px] h-[30px] bg-[#E7F3FF] rounded-[5px] ml-[10px] flex justify-center items-center">
                    <i class="fa-solid fa-plus text-[#6D6E7F] text-[13px]"></i>
                </div>

                <p class="ml-[12px] text-[15px] text-[#65686C]">
                    Add filters
                </p>

            </button>

            <!-- campaign -->
            <button class="w-[125px] h-[38px] ml-[10px] bg-white border-[1px] border-[#CED0D4] rounded-[6px] hover:bg-[#F2F2F2] flex justify-center items-center gap-[8px] cursor-pointer">

                <p class="text-[15px]">Campaign</p>

                <i class="fa-solid fa-caret-down text-[12px]"></i>

            </button>

            <!-- forms -->
            <button class="w-[95px] h-[38px] ml-[10px] bg-white border-[1px] border-[#CED0D4] rounded-[6px] hover:bg-[#F2F2F2] flex justify-center items-center gap-[8px] cursor-pointer">

                <p class="text-[15px]">Forms</p>

                <i class="fa-solid fa-caret-down text-[12px]"></i>

            </button>

            <!-- select dates -->
            <button class="w-[165px] h-[38px] ml-[10px] bg-white border-[1px] border-[#CED0D4] rounded-[6px] hover:bg-[#F2F2F2] flex justify-center items-center gap-[10px] cursor-pointer">

                <i class="fa-regular fa-calendar text-[15px]"></i>

                <p class="text-[15px]">Select dates</p>

                <i class="fa-solid fa-caret-down text-[12px]"></i>

            </button>

            <!-- status -->
            <button class="w-[110px] h-[38px] ml-[10px] bg-white border-[1px] border-[#CED0D4] rounded-[6px] hover:bg-[#F2F2F2] flex justify-center items-center gap-[8px] cursor-pointer">

                <p class="text-[15px]">Status</p>

                <i class="fa-solid fa-caret-down text-[12px]"></i>

            </button>

            <!-- source -->
            <button class="w-[110px] h-[38px] ml-[10px] bg-white border-[1px] border-[#CED0D4] rounded-[6px] hover:bg-[#F2F2F2] flex justify-center items-center gap-[8px] cursor-pointer">

                <p class="text-[15px]">Source</p>

                <i class="fa-solid fa-caret-down text-[12px]"></i>

            </button>

            <!-- assigned to -->
            <button class="w-[140px] h-[38px] ml-[10px] bg-white border-[1px] border-[#CED0D4] rounded-[6px] hover:bg-[#F2F2F2] flex justify-center items-center gap-[8px] cursor-pointer">

                <p class="text-[15px]">Assigned to</p>

                <i class="fa-solid fa-caret-down text-[12px]"></i>

            </button>

            <!-- labels -->
            <button class="w-[105px] h-[38px] ml-[10px] bg-white border-[1px] border-[#CED0D4] rounded-[6px] hover:bg-[#F2F2F2] flex justify-center items-center gap-[8px] cursor-pointer">

                <p class="text-[15px]">Labels</p>

                <i class="fa-solid fa-caret-down text-[12px]"></i>

            </button>

            <!-- more -->
            <button class="w-[45px] h-[38px] ml-[10px] bg-white border-[1px] border-[#CED0D4] rounded-[6px] hover:bg-[#F2F2F2] flex justify-center items-center cursor-pointer">

                <i class="fa-solid fa-ellipsis text-[16px]"></i>

            </button>

        </div>
        </div>

    
</div>







    </div>
</body>
</html>

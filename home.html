<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>facebook</title>
     <script src="https://cdn.tailwindcss.com"></script>

     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>

</head>
<body class="bg-[#F3F4F7]">
    <!-- container -->
    <div class="w-screen h-screen bg-[#F3F4F7] flex flex-col">
        <!-- navbar -->
        <div class="navbar w-[100%] h-[60px] bg-white border-b-[1px] border-[#DCDDE0] shadow-md flex fixed ">
            <!-- group1 logo and searchbar-->
            <div class="flex justify-center items-center gap-[10px]">
                <img src="facebooklogo.PNG" class="w-[40px] h-[40px] rounded-[20px] ml-[20px] cursor-pointer" alt="">
                <!-- search bar -->
                <div class="flex text-[#65686C] w-[250px] h-[40px] bg-[#F1F2F5] gap-[8px] items-center rounded-[20px] text-[16px]">
                    <i class="fa-solid fa-magnifying-glass ml-[10px]"></i>
                    <input type="text" class="bg-transparent outline-none" placeholder="Search Facebook">
                </div>
            </div>
            <!-- group2 appicons -->
            <div class="w-[670px] h-[60px] ml-[80px] text-[24px] flex items-center">
                <div class="w-[130px] h-[60px]  flex flex-col items-center justify-end cursor-pointer">
                    <i class="fa-solid fa-house mb-[15px]" style="color: rgb(10, 102, 255);"></i>
                    <div class="w-[130px] h-[3px] bg-[#0966FF]"></div>
                </div>
                <div class="w-[540px] h-[60px] flex items-center justify-between gap-2px text-[22px]" >
                    <div class="w-[130px] h-[50px] bg-transparent cursor-pointer flex justify-center items-center hover:bg-[#F2F2F2] rounded-[10px]"><img src="contacts.png" class="w-[45px] h-[45px]" alt=""></div>
                    <div class="w-[130px] h-[50px] bg-transparent cursor-pointer flex justify-center items-center hover:bg-[#F2F2F2] rounded-[10px]"><img src="reel.png" class="w-[26px] h-[26px]" alt=""></div>
                    <div class="w-[130px] h-[50px] bg-transparent cursor-pointer flex justify-center items-center hover:bg-[#F2F2F2] rounded-[10px]"><img src="shop.png" class="w-[65px] h-[40px]" alt=""></div>
                    <div class="w-[130px] h-[50px] bg-transparent cursor-pointer flex justify-center items-center hover:bg-[#F2F2F2] rounded-[10px]"><i class="fa-solid fa-users-line" style="color: rgb(101, 104, 108);"></i></div>
                </div>
            </div>
            <!-- grp 3 menubar -->
             <div class=" relative w-[183px] h-[60px] ml-[160px] text-[20px] flex justify-between items-center">
                <div class="w-[40px] h-[40px] bg-[#E2E5E9] rounded-[30px] flex items-center justify-center cursor-pointer hover:bg-[#D6D9DD]"><img class="w-[26px] h-[26px]" src="menu.svg" alt=""></div>
                <div class="w-[40px] h-[40px] bg-[#E2E5E9] rounded-[30px] flex items-center justify-center cursor-pointer hover:bg-[#D6D9DD]"><i class="fa-brands fa-facebook-messenger" style="color: rgb(8, 8, 9);"></i></div>
                <div class="w-[40px] h-[40px] bg-[#E2E5E9] rounded-[30px] flex items-center justify-center cursor-pointer hover:bg-[#D6D9DD]"><i class="fa-solid fa-bell" style="color: rgb(8, 8, 9);"></i></div>
                <img src="profile.jpg" class="w-[40px] h-[40px] rounded-[30px] cursor-pointer" alt="">
                <div class="absolute right-[38px] top-[2px] w-[25px] h-[23px] rounded-[11px] bg-[#DD2434] flex justify-center items-center cursor-pointer"><p class="text-[15px] text-white">12</p></div>
                <div class="absolute right-[0px] bottom-[8px] w-[16px] h-[16px] border-[2px] border-[#FFFFFF] rounded-[11px] bg-[#E2E5E9] flex justify-center items-center cursor-pointer"><i class="fa-solid fa-angle-down text-[12px]" style="color: rgb(8, 8, 9);"></i></div>
            </div>
        </div>
        <!-- main -->
        <div class=" w-[100%] h-[100vh] bg-[#F3F4F7]">
            <!-- left sidebar -->
            <div class="w-[400px] h-[92vh]  fixed mt-[60px] text-[#080809]">
                <div class="w-[338px] h-[660px]  mt-[15px] ml-[15px]">
                    <div class="w-[338px] h-[55px] bg-transparent rounded-[8px] flex gap-[15px] items-center hover:bg-[#E7E8EA] cursor-pointer"><img src="profile.jpg" class="w-[38px] h-[38px] rounded-[30px] ml-[10px]" alt=""><p>Shifas shifu</p></div>
                    <div class="w-[338px] h-[55px] bg-transparent rounded-[8px] flex gap-[15px] items-center hover:bg-[#E7E8EA] cursor-pointer"><img src="metaai.png" class="w-[38px] h-[38px] rounded-[30px] ml-[10px]" alt=""><p>Meta AI</p></div>
                    <div class="w-[338px] h-[55px] bg-transparent rounded-[8px] flex gap-[15px] items-center hover:bg-[#E7E8EA] cursor-pointer"><img src="friends.png" class="w-[38px] h-[38px] rounded-[30px] ml-[10px]" alt=""><p>Friends</p></div>
                    <div class="w-[338px] h-[55px] bg-transparent rounded-[8px] flex gap-[15px] items-center hover:bg-[#E7E8EA] cursor-pointer"><img src="memories.png" class="w-[38px] h-[38px] rounded-[30px] ml-[10px]" alt=""><p>Memories</p></div>
                    <div class="w-[338px] h-[55px] bg-transparent rounded-[8px] flex gap-[15px] items-center hover:bg-[#E7E8EA] cursor-pointer"><img src="saved.png" class="w-[38px] h-[38px] rounded-[30px] ml-[10px]" alt=""><p>Saved</p></div>
                    <div class="w-[338px] h-[55px] bg-transparent rounded-[8px] flex gap-[15px] items-center hover:bg-[#E7E8EA] cursor-pointer"><img src="groups.png" class="w-[38px] h-[38px] rounded-[30px] ml-[10px]" alt=""><p>Groups</p></div>
                    <div class="w-[338px] h-[55px] bg-transparent rounded-[8px] flex gap-[15px] items-center hover:bg-[#E7E8EA] cursor-pointer"><img src="reels.png" class="w-[38px] h-[38px] rounded-[30px] ml-[10px]" alt=""><p>Reels</p></div>
                    <div class="w-[338px] h-[55px] bg-transparent rounded-[8px] flex gap-[15px] items-center hover:bg-[#E7E8EA] cursor-pointer"><img src="market.png" class="w-[38px] h-[38px] rounded-[30px] ml-[10px]" alt=""><p>Marketplace</p></div>
                    <div class="w-[338px] h-[55px] bg-transparent rounded-[8px] flex gap-[15px] items-center hover:bg-[#E7E8EA] cursor-pointer"><img src="feeds.png" class="w-[38px] h-[38px] rounded-[30px] ml-[10px]" alt=""><p>Feeds</p></div>
                    <div class="w-[338px] h-[55px] bg-transparent rounded-[8px] flex gap-[15px] items-center hover:bg-[#E7E8EA] cursor-pointer"><img src="events.png" class="w-[38px] h-[38px] rounded-[30px] ml-[10px]" alt=""><p>Events</p></div>
                    <div class="w-[338px] h-[55px] bg-transparent rounded-[8px] flex gap-[15px] items-center hover:bg-[#E7E8EA] cursor-pointer"><img src="ads.png" class="w-[38px] h-[38px] rounded-[30px] ml-[10px]" alt=""><p>Ads Manager</p></div>
                    <div class="w-[338px] h-[55px] bg-transparent rounded-[8px] flex gap-[15px] items-center hover:bg-[#E7E8EA] cursor-pointer"><div class="w-[38px] h-[38px] rounded-[30px] ml-[10px] flex justify-center items-center bg-[#D6D9DD]"><i class="fa-solid fa-angle-down" style="color: rgb(8, 8, 9);"></i></div><p>See more</p></div>
                </div>
                <div class=" ml-[22px] mt-[35px] flex flex-col gap-0">
                    <footer class="flex items-center gap-[4px] text-[#65686D] text-[14px] h-[6px]">
                        <a class="hover:underline" href="#">Privacy</a>
                        <p class="pb-[5px]">.</p>
                        <a class="hover:underline" href="#">Terms</a>
                        <p class="pb-[5px]">.</p>
                        <a class="hover:underline" href="#">Advertising</a>
                        <p class="pb-[5px]">.</p>
                        <a class="hover:underline" href="#">Ad choices</a>
                        <p class="pb-[5px]">.</p>
                    </footer>
                    <footer class="flex items-center gap-[4px] mb-[5px] text-[#65686D] text-[14px]">
                        <a class="hover:underline" href="#">Cookies</a>
                        <p class="pb-[5px]">.</p>
                        <a class="hover:underline" href="#">More</a>
                    </footer>
                </div>
            </div>
            <!-- middle main section -->
             <div class="w-[670px]  h-[300vh] ml-[400px] mt-[60px]">
                <!-- post creation section -->
                 <div class="w-[670px] h-[65px] shadow-md rounded-[12px] bg-white mt-[80px] flex items-center">
                    <img src="profile.jpg" class="w-[40px] h-[40px] rounded-[30px] cursor-pointer ml-[15px]" alt="">
                    <div class="w-[458px] h-[40px] bg-[#F1F2F5] ml-[8px] rounded-[20px] flex items-center text-[#606366] hover:bg-[#E5E6E9] cursor-pointer"><p class="ml-[15px]">What's on your mind, Shifas?</p></div>
                    <div class="w-[40px] h-[40px] bg-transparent flex items-center justify-center rounded-[5px] ml-[10px] hover:bg-[#F1F2F5] cursor-pointer"><img src="video.png" class="w-[48px] h-[53px]" alt="" ></div>
                    <div class="w-[42px] h-[40px] bg-transparent flex items-center justify-center rounded-[5px] hover:bg-[#F1F2F5] cursor-pointer"><img src="images.png" class="w-[30px] h-[34px] " alt="" ></div>
                     <div class="w-[40px] h-[40px] hover:bg-[#F1F2F5] flex items-center justify-center rounded-[5px] cursor-pointer"><img src="happy.png" class="w-[30px] h-[30px] " alt="" ></div>
                 </div>
                 <!-- stories -->
                <div class="flex mt-[15px] gap-[10px]">
                    <div class="group relative w-[110px] h-[165px] flex flex-col bg-white rounded-xl overflow-hidden cursor-pointer shadow-md ">
                            <div class="w-full h-[60%] overflow-hidden">
                                <img src="profile.jpg" alt="" class="w-full h-full object-cover transition-transform duration-300 ease-in-out group-hover:scale-[1.08]"/>
                            </div>
                        <div class="w-full h-[40%] flex items-end justify-center pb-4 relative bg-white group-hover:bg-gray-50 transition-colors duration-200 ">
                            <div class="absolute -top-5 left-1/2 -translate-x-1/2 w-10 h-10 bg-blue-600 rounded-full border-4 border-white flex items-center justify-center text-white text-xl font-bold shadow-sm group-hover:bg-blue-700 transition-colors duration-200">+</div>
                                <span class="text-gray-800 font-sans text-xs font-semibold tracking-wide select-none">Create story</span>
                        </div>
                    </div>
                    <!-- story 1 -->
                    <div class="group relative w-[110px] h-[165px] rounded-xl overflow-hidden cursor-pointer shadow-md">
                            <img src="fab_story.jpg" alt="" class="w-full h-full object-cover transition-transform duration-300 ease-in-out group-hover:scale-[1.08]"/>
                        <div class="absolute bottom-0 left-0 w-full p-2.5 bg-gradient-to-t from-black/70 to-transparent">
                            <p class="text-white font-sans text-sm m-0">Fabrizio Romano</p>
                        </div>
                        <div class="absolute top-[12px] left-[12px] w-[38px] h-[38px] rounded-full bg-blue-600 flex items-center justify-center">
                            <img src="fabrizio_profile.jpg" alt="" class="w-[31px] h-[31px] rounded-full">
                        </div>
                    </div>
                    <!-- story 2 -->
                        <div class="group relative w-[110px] h-[165px] rounded-xl overflow-hidden cursor-pointer shadow-md">
                                <img src="download-14.jpg" alt="" class="w-full h-full object-cover transition-transform duration-300 ease-in-out group-hover:scale-[1.08]"/>
                            <div class="absolute bottom-0 left-0 w-full p-2.5 bg-gradient-to-t from-black/70 to-transparent">
                                <p class="text-white font-sans text-sm m-0">Anas anas</p>
                            </div>
                            <div class="absolute top-[12px] left-[12px] w-[38px] h-[38px] rounded-full bg-blue-600 flex items-center justify-center">
                                <img src="download-8.jpg" alt="" class="w-[31px] h-[31px] rounded-full">
                            </div>
                        </div>
                </div>


             </div>

        </div>
    </div>
</body>
</html>

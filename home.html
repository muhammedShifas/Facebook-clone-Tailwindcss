<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>facebook</title>
     <script src="https://cdn.tailwindcss.com"></script>

     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        *{
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body class="bg-black">
    <!-- container -->
    <div class="w-screen h-screen bg-black flex flex-col">
        <!-- navbar -->
        <div class="navbar w-[100%] h-[60px] bg-white border-b-[1px] border-[#DCDDE0] shadow-[0_20px_50px_rgba(0,0,0,0.4)] flex  ">
            <!-- group1 logo and searchbar-->
            <div class="flex justify-center items-center gap-[10px]">
                <img src="facebooklogo.PNG" class="w-[40px] h-[40px] rounded-[20px] ml-[20px] cursor-pointer" alt="">
                <!-- search bar -->
                <div class="flex text-[#65686C] w-[250px] h-[40px] bg-[#F1F2F5] gap-[8px] items-center rounded-[20px] text-[16px]">
                    <i class="fa-solid fa-magnifying-glass ml-[10px]"></i>
                    <input type="text" class="bg-transparent outline-none" placeholder="Search Facebook">
                </div>
            </div>
            <!-- group2 appicons -->
            <div class="w-[670px] h-[60px] ml-[80px] text-[24px] flex items-center">
                <div class="w-[130px] h-[60px]  flex flex-col items-center justify-end cursor-pointer">
                    <i class="fa-solid fa-house mb-[15px]" style="color: rgb(10, 102, 255);"></i>
                    <div class="w-[130px] h-[3px] bg-[#0966FF]"></div>
                </div>
                <div class="w-[540px] h-[60px] flex items-center justify-between gap-2px text-[22px]" >
                    <div class="w-[130px] h-[50px] bg-transparent cursor-pointer flex justify-center items-center hover:bg-[#F2F2F2] rounded-[10px]"><img src="contacts.png" class="w-[45px] h-[45px]" alt=""></div>
                    <div class="w-[130px] h-[50px] bg-transparent cursor-pointer flex justify-center items-center hover:bg-[#F2F2F2] rounded-[10px]"><img src="reel.png" class="w-[26px] h-[26px]" alt=""></div>
                    <div class="w-[130px] h-[50px] bg-transparent cursor-pointer flex justify-center items-center hover:bg-[#F2F2F2] rounded-[10px]"><img src="shop.png" class="w-[65px] h-[40px]" alt=""></div>
                    <div class="w-[130px] h-[50px] bg-transparent cursor-pointer flex justify-center items-center hover:bg-[#F2F2F2] rounded-[10px]"><i class="fa-solid fa-users-line" style="color: rgb(101, 104, 108);"></i></div>
                </div>
            </div>
            <!-- grp 3 menubar -->
             <div class=" relative w-[183px] h-[60px] ml-[160px] text-[20px] flex justify-between items-center">
                <div class="w-[40px] h-[40px] bg-[#E2E5E9] rounded-[30px] flex items-center justify-center cursor-pointer hover:bg-[#D6D9DD]"><img class="w-[26px] h-[26px]" src="menu.svg" alt=""></div>
                <div class="w-[40px] h-[40px] bg-[#E2E5E9] rounded-[30px] flex items-center justify-center cursor-pointer hover:bg-[#D6D9DD]"><i class="fa-brands fa-facebook-messenger" style="color: rgb(8, 8, 9);"></i></div>
                <div class="w-[40px] h-[40px] bg-[#E2E5E9] rounded-[30px] flex items-center justify-center cursor-pointer hover:bg-[#D6D9DD]"><i class="fa-solid fa-bell" style="color: rgb(8, 8, 9);"></i></div>
                <img src="profile.jpg" class="w-[40px] h-[40px] rounded-[30px] cursor-pointer" alt="">
                <div class="absolute right-[38px] top-[2px] w-[25px] h-[23px] rounded-[11px] bg-[#DD2434] flex justify-center items-center cursor-pointer"><p class="text-[15px] text-white">12</p></div>
                <div class="absolute right-[0px] bottom-[8px] w-[16px] h-[16px] border-[2px] border-[#FFFFFF] rounded-[11px] bg-[#E2E5E9] flex justify-center items-center cursor-pointer"><i class="fa-solid fa-angle-down text-[12px]" style="color: rgb(8, 8, 9);"></i></div>
            </div>
        </div>
        <!-- main -->
        <div class=" w-[100%] h-[100vh] bg-[#F3F4F7]">

        </div>
    </div>
</body>
</html>
